<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locked // BTRFS Commander</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background-color: #050505; color: #e0e0e0;
            font-family: 'Roboto Mono', monospace;
            background-image: 
                linear-gradient(#333 1px, transparent 1px),
                linear-gradient(90deg, #333 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: -1px -1px;
        }
        
        .login-card {
            background: #0f0f0f;
            width: 320px;
            padding: 40px;
            position: relative;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Brackets */
        .login-card::before, .login-card::after {
            content: ''; position: absolute; width: 15px; height: 15px;
            border-color: #fff; border-style: solid; transition: 0.3s;
        }
        .login-card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
        .login-card::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
        .login-card:hover::before, .login-card:hover::after { border-color: #ff4d00; }

        h2 { margin: 0 0 30px 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
        h2 span { color: #ff4d00; }

        input {
            width: 100%; padding: 12px; background: #000; border: 1px solid #333;
            color: #fff; font-family: inherit; box-sizing: border-box;
            margin-bottom: 20px; outline: none; transition: 0.2s;
        }
        input:focus { border-color: #ff4d00; }

        button {
            width: 100%; padding: 12px; background: #e0e0e0; color: #000;
            border: none; font-weight: 700; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            font-family: inherit; transition: 0.2s;
        }
        button:hover { background: #ff4d00; color: #fff; }

        .error {
            color: #ff3333; text-align: center; margin-bottom: 20px;
            font-size: 0.8rem; display: none; padding: 10px;
            border: 1px solid #500; background: rgba(50,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>// Locked <span>_</span></h2>
        <div id="error" class="error">Access Denied</div>
        <form onsubmit="doLogin(event)">
            <input type="password" id="pass" placeholder="PASSWORD" required autofocus>
            <button type="submit">Initialize Session</button>
        </form>
    </div>
    <script>
        async function doLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('pass').value;
            const err = document.getElementById('error');
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: 'password=' + encodeURIComponent(pass)
                });
                if(res.ok) {
                    window.location.href = '/?t=' + Date.now();
                } else {
                    err.style.display = 'block';
                    err.innerText = "INVALID CREDENTIALS";
                    document.getElementById('pass').value = '';
                }
            } catch(e) {
                err.style.display = 'block';
                err.innerText = "CONNECTION FAILURE";
            }
        }
    </script>
</body>
</html>
