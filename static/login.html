<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body { display:flex; justify-content:center; align-items:center; height:100vh; background:#f0f2f5; font-family:sans-serif; }
        form { background:white; padding:30px; border-radius:8px; box-shadow:0 4px 6px rgba(0,0,0,0.1); width:300px; }
        input { width:100%; padding:10px; margin-bottom:15px; border:1px solid #ddd; border-radius:4px; box-sizing:border-box; }
        button { width:100%; padding:10px; background:#2563eb; color:white; border:none; border-radius:4px; cursor:pointer; }
    </style>
</head>
<body>
    <form onsubmit="doLogin(event)">
        <h2 style="margin-top:0">Locked 🔒</h2>
        <input type="password" id="pass" placeholder="Password" required>
        <button type="submit">Unlock</button>
    </form>
    <script>
        async function doLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('pass').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'password=' + encodeURIComponent(pass)
            });
            if(res.ok) window.location.href = '/';
            else alert("Wrong password");
        }
    </script>
</body>
</html>
